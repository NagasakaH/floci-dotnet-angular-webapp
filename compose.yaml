services:
  floci:
    image: floci/floci:1.5.33
    ports:
      - "4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-northeast-1
      # The PoC is intentionally ephemeral. This also avoids host/volume UID
      # differences affecting Floci's JSON persistence on macOS.
      FLOCI_STORAGE_MODE: memory
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: floci-poc
      # Floci handles browser preflights globally before API Gateway routing.
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:4200
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_HEADERS: Authorization,Content-Type
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - floci-poc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 2s
      retries: 30

networks:
  floci-poc:
    name: floci-poc
